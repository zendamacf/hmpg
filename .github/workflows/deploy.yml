name: Deploy to VPS

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: hmpg-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cp .env.example .env
          {
            echo 'DB_PASSWORD=hmpg'
            echo 'UNSPLASH_ACCESS_KEY=ci-dummy-unsplash-key'
            echo 'CRON_SECRET=test-secret'
            echo 'ORIGIN=http://localhost:3000'
          } >> .env

      - name: Build and start Compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait

      - name: Smoke test health endpoint
        run: curl -sf http://localhost:3000/health | grep -q ok

      - name: Smoke test /refresh auth rejected without token
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/refresh)
          test "$code" = "401"

      - name: Verify migrations applied
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T postgres \
            psql -U hmpg -d hmpg -c '\dt' | grep -q image

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  deploy:
    needs: deploy-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/hmpg
            git fetch --tags --force
            git checkout "${{ github.ref_name }}"
            docker compose --profile production up -d --build
