name: PR Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-tests

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hmpg
          POSTGRES_PASSWORD: hmpg
          POSTGRES_DB: hmpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Set test DATABASE_URL
        run: echo "DATABASE_URL=postgresql://hmpg:hmpg@localhost:5432/hmpg" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --engine-strict=false

      - name: Run Migrations
        run: npm run db:migrate

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

      - name: Post coverage comment
        if: success() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json

  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          {
            echo 'DB_PASSWORD=hmpg'
            echo 'UNSPLASH_ACCESS_KEY=ci-dummy-unsplash-key'
            echo 'CRON_SECRET=test-secret'
            echo 'ORIGIN=http://localhost:3000'
            echo 'PUBLIC_SENTRY_DSN='
            echo 'APP_IMAGE=hmpg:ci'
          } > .env

      - name: Build and start Compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait

      - name: Smoke test health endpoint
        run: curl -sf http://localhost:3000/health | grep -q ok

      - name: Seed sample image for homepage
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T postgres \
            psql -U hmpg -d hmpg -c "INSERT INTO image (unspashid, latitude, longitude, location, author_name, author_instagram, url)
            VALUES ('ci-seed', '0', '0', 'CI', 'CI', null, 'https://example.com/ci.jpg')
            ON CONFLICT DO NOTHING;"

      - name: Smoke test homepage
        run: curl -sf http://localhost:3000/ | grep -q '<'

      - name: Smoke test /refresh auth
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/refresh)
          test "$code" = "401"
          # Valid auth reaches Unsplash; dummy key should fail after auth (not 401)
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer test-secret" http://localhost:3000/refresh)
          test "$code" != "401"

      - name: Verify migrations applied
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T postgres \
            psql -U hmpg -d hmpg -c '\dt' | grep -q image

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
