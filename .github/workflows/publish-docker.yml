name: Publish Docker image

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: hmpg-publish-docker
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cp .env.example .env
          {
            echo 'DB_PASSWORD=hmpg'
            echo 'UNSPLASH_ACCESS_KEY=ci-dummy-unsplash-key'
            echo 'CRON_SECRET=test-secret'
            echo 'ORIGIN=http://localhost:3000'
          } >> .env

      - name: Build and start Compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait

      - name: Smoke test health endpoint
        run: curl -sf http://localhost:3000/health | grep -q ok

      - name: Smoke test /refresh auth rejected without token
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/refresh)
          test "$code" = "401"

      - name: Verify migrations applied
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T postgres \
            psql -U hmpg -d hmpg -c '\dt' | grep -q image

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  publish:
    needs: deploy-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: meta
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            DATABASE_URL=postgresql://hmpg:hmpg@postgres:5432/hmpg
            UNSPLASH_ACCESS_KEY=build-placeholder
            CRON_SECRET=build-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
