name: PR Linting

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-linting

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --engine-strict=false

      - name: Lint
        run: npm run lint

      - name: Typescript
        run: npm run typecheck

      - name: Svelte
        run: npm run check