version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 30
    ignore:
      # Require manual update due to breaking compatibility with other dependencies
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      everything:
        patterns:
          - "*"
